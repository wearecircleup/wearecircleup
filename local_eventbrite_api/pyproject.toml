[project]
name = "local-eventbrite-api"
version = "0.1.0"
description = "Local-only FastAPI CRUD interface for Eventbrite"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "python-multipart>=0.0.9,<1.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.0,<3.0",
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "live: performs real Eventbrite operations using the configured private token",
]

[tool.uv]
package = false
